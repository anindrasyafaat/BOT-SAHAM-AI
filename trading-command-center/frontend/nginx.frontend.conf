# Nginx di dalam container frontend: sajikan build Vite (SPA). Reverse proxy /api & /ws ada di ../nginx.conf.
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

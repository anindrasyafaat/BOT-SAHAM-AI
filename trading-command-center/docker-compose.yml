# Trading Command Center - Docker Compose Configuration
# Docker Compose untuk Trading Command Center AI
# Version: 1.0.0

services:
  # Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tcc-backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"   # hanya lokal; akses publik lewat nginx
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///data/trading.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - APP_PASSWORD=${APP_PASSWORD:?Isi APP_PASSWORD di .env (password login dashboard)}
      - SECRET_KEY=${SECRET_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # agar backend bisa memanggil Ollama di komputer host
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    networks:
      - tcc-network

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tcc-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - tcc-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: tcc-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
    networks:
      - tcc-network

networks:
  tcc-network:
    driver: bridge
[pytest]
asyncio_default_fixture_loop_scope = function
# Deprecation di kode kita = error; pengecualian hanya untuk pustaka pihak ketiga yang belum diperbarui.
filterwarnings =
    error::DeprecationWarning
    ignore:Timestamp.dayofyear is deprecated:DeprecationWarning
    ignore:The 'mode.copy_on_write' option is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
